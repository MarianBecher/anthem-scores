name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The data build (npm run build) is not run here: it needs the download
      # cache or network access to Wikimedia. The committed anthems/ are
      # checked by npm test.
      - run: npm run build:package
